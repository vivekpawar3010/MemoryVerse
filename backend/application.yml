spring:
  application:
    name: memoryverse-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/memoryverse_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:MemoryVerseSecretKey2026SuperSecureTokenValueForJWTAuth}
  expirationMs: 86400000 # 24 Hours

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:demo}
  api_key: ${CLOUDINARY_API_KEY:demo}
  api_secret: ${CLOUDINARY_API_SECRET:demo}
